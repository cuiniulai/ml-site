<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的网站合集</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 60%, #ecfeff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: #1f2937;
    }
    h1 { font-size: 30px; font-weight: 700; margin-bottom: 8px; }
    .sub { color: #6b7280; font-size: 15px; margin-bottom: 36px; }
    .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
    .card {
      width: 260px;
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 6px 24px rgba(37, 99, 235, 0.12);
      transition: transform .18s ease, box-shadow .18s ease;
      border: 1px solid #eef2ff;
    }
    .card:hover { transform: translateY(-6px); box-shadow: 0 14px 34px rgba(37, 99, 235, 0.22); }
    .emoji { font-size: 46px; margin-bottom: 14px; }
    .card h2 { font-size: 19px; margin-bottom: 8px; }
    .card p { font-size: 13px; color: #6b7280; line-height: 1.6; }
    footer { margin-top: 40px; font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <h1>我的网站合集</h1>
  <div class="sub">选择一个网站进入</div>

  <div class="cards">
    <a class="card" href="playground.html">
      <div class="emoji">🧠</div>
      <h2>神经网络游乐场</h2>
      <p>从零实现的交互式神经网络<br>可视化教学网站（课程作业）</p>
    </a>
    <a class="card" href="old.html">
      <div class="emoji">🌐</div>
      <h2>旧网站</h2>
      <p>之前制作的个人网站<br>点击查看</p>
    </a>
  </div>

  <footer>部署于 GitHub Pages · 纯静态网站</footer>
</body>
</html>
